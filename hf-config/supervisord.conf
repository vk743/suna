; Supervisor configuration for Hugging Face Space
; Manages all processes in a single container
; All logs and PIDs go to /tmp (required for HF non-root permissions)
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info
; Clear log file on startup
strip_ansi=false
user=root
[program:redis]
command=redis-server --dir /tmp --save "" --appendonly no --daemonize no
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/tmp/redis_stdout.log
stderr_logfile=/tmp/redis_stderr.log
priority=100
[program:backend]
; FastAPI backend using uvicorn
command=bash -c "cd /app/backend && uv run gunicorn api:app -w ${WORKERS:-4} -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout ${TIMEOUT:-75} --graceful-timeout 30 --keep-alive 65"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
environment=REDIS_HOST="localhost",REDIS_PORT="6379",REDIS_PASSWORD="",REDIS_SSL="False",PYTHONPATH="/app"
stdout_logfile=/tmp/backend_stdout.log
stderr_logfile=/tmp/backend_stderr.log
pidfile=/tmp/backend.pid
priority=200
[program:frontend]
; Next.js frontend (standalone mode)
; Standalone build server.js is in .next/standalone/apps/frontend/server.js
; We set PORT=3000 and HOSTNAME=0.0.0.0 for the server to bind correctly
command=node apps/frontend/server.js
directory=/app/standalone
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
stdout_logfile=/tmp/frontend_stdout.log
stderr_logfile=/tmp/frontend_stderr.log
pidfile=/tmp/frontend.pid
priority=300
[program:nginx]
; Nginx reverse proxy (must start last, after frontend/backend are ready)
command=nginx -c /app/hf-config/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/tmp/nginx_stdout.log
stderr_logfile=/tmp/nginx_stderr.log
pidfile=/tmp/nginx.pid
priority=400
; Event listeners for process state changes
[eventlistener:process_state]
command=bash -c "echo 'Process state event'"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
buffer_size=100
stdout_logfile=/tmp/events.log
